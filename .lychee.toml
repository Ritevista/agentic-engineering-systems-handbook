exclude_path = [
  ".git",
  "book/404.html",
]

exclude = [
  "^mailto:",
  # GitHub Actions status badges are dynamically generated images, not
  # content links. They 404 for any workflow that doesn't exist yet on
  # the default branch (e.g. a new workflow added on a feature branch),
  # which is a CI-timing false positive rather than a real dead link.
  "^https://github\\.com/[^/]+/[^/]+/actions/workflows/[^/]+/badge\\.svg$",
]

accept = [
  "200",
  "204",
  "206",
  "301",
  "302",
  "403",
  "429",
]

max_retries = 2
timeout = 20
